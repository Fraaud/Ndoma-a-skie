<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ndoma a skié</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <!-- Fascia della simulazione: fuori da #vista, che viene riscritto a ogni
       cambio di schermata. Se restasse dentro, sparirebbe al primo tap. -->
  <div id="fascia-simulazione" hidden></div>

  <main id="vista"><div class="carico">Carico...</div></main>

  <!-- Quattro voci, non cinque. Sapere sta nel Profilo e nei rimandi dentro
       la scheda gita: e' roba che si legge una volta, e teneva occupato un
       quinto della barra per sempre. -->
  <nav>
    <button data-vista="weekend" class="on">
      <svg viewBox="0 0 24 24"><path d="M3 19h18"/><path d="M5 19 11 6l3 6 2-3 4 10"/></svg>
      Weekend</button>
    <button data-vista="gite">
      <svg viewBox="0 0 24 24"><path d="M9 4 3 6v14l6-2 6 2 6-2V4l-6 2Z"/><path d="M9 4v14"/><path d="M15 6v14"/></svg>
      Gite</button>
    <button data-vista="passaggi">
      <svg viewBox="0 0 24 24"><path d="M5 17h14"/><path d="M6 17v2"/><path d="M18 17v2"/><path d="M4 17v-4l2-5h12l2 5v4"/><path d="M7 13h10"/></svg>
      Passaggi</button>
    <button data-vista="profilo">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-3.4 3.1-5.5 7-5.5s7 2.1 7 5.5"/></svg>
      Profilo</button>
  </nav>

  <script src="/static/app.js"></script>
</body>
</html>
